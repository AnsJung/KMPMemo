name: iOS 빌드 검사

on: pull_request

permissions:
  contents: read

jobs:
  ios-build:
    name: iOS 시뮬레이터 빌드
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: JDK 17 및 Gradle 캐시 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Xcode 및 시뮬레이터 SDK 확인
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: iOS 시뮬레이터 앱 빌드
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/kmpmemo-derived-data" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build

      - name: 시뮬레이터 앱 생성 확인
        run: |
          app="$RUNNER_TEMP/kmpmemo-derived-data/Build/Products/Debug-iphonesimulator/KMPMemo.app"
          test -x "$app/KMPMemo"
          ls -lh "$app/KMPMemo"
