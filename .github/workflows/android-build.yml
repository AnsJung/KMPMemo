name: Android 빌드 검사

on: pull_request

permissions:
  contents: read

jobs:
  android-build:
    name: Android 디버그 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: JDK 17 및 Gradle 캐시 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 디버그 APK 빌드
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: 디버그 APK 생성 확인
        run: |
          apk=androidApp/build/outputs/apk/debug/androidApp-debug.apk
          test -s "$apk"
          ls -lh "$apk"
